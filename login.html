<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宁公车管理平台 · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-deep: #001645;
    --primary-light: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --bg: #F9F9F9;
    --field-bg: #F5F7FA;
  }

  html, body { height: 100%; }
  body {
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ============ 整体：左右分屏 ============ */
  .login-page {
    display: flex;
    height: 100vh;
    min-height: 640px;
  }

  /* ============ 左侧品牌区 ============ */
  .login-left {
    flex: 1.1;
    background: linear-gradient(135deg, #001645 0%, #0A4FB8 52%, #014DB2 100%);
    color: #fff;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 72px;
  }
  .login-left::before {
    content: '';
    position: absolute;
    top: -200px; left: -160px;
    width: 560px; height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 70%);
  }
  .login-left::after {
    content: '';
    position: absolute;
    bottom: -220px; right: -120px;
    width: 520px; height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16,185,129,.22) 0%, rgba(16,185,129,0) 65%);
  }
  .login-left > * { position: relative; z-index: 1; }

  .brand-top { display: flex; flex-direction: column; gap: 30px; }
  .brand-logo {
    width: 76px; height: 76px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.08) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .brand-text h1 {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1.35;
    text-shadow: 0 2px 14px rgba(0,0,0,.22);
  }
  .brand-text .subtitle {
    margin-top: 14px;
    font-size: 13.5px;
    color: rgba(255,255,255,.7);
    letter-spacing: 4px;
    font-weight: 500;
  }

  .features {
    list-style: none;
    margin-top: 56px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .features li {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 15px;
    color: rgba(255,255,255,.92);
    letter-spacing: .5px;
  }
  .features li .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #10B981;
    box-shadow: 0 0 12px rgba(16,185,129,.7);
    flex-shrink: 0;
  }

  .copy {
    font-size: 13px;
    color: rgba(255,255,255,.5);
    letter-spacing: 1px;
  }

  /* ============ 右侧登录区 ============ */
  .login-right {
    flex: 1;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    overflow-y: auto;
  }
  .login-card {
    width: 100%;
    max-width: 400px;
  }

  .card-head { margin-bottom: 38px; }
  .card-logo {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #0A5FD4 0%, #014DB2 100%);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
    box-shadow: 0 10px 24px rgba(1,77,178,.3), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .card-head h2 {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 1.5px;
  }
  .card-head .card-sub {
    margin-top: 8px;
    font-size: 13.5px;
    color: var(--muted);
    letter-spacing: .5px;
  }

  .form { display: flex; flex-direction: column; gap: 18px; }
  .form-field { display: flex; flex-direction: column; gap: 8px; }
  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--sub);
    padding-left: 4px;
    letter-spacing: .5px;
  }
  .field {
    height: 50px;
    border-radius: 12px;
    background: var(--field-bg);
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    border: 1.5px solid transparent;
    transition: all .2s;
  }
  .field:focus-within {
    background: #fff;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(1,77,178,.1), 0 4px 12px rgba(1,77,178,.06);
  }
  .field:focus-within svg * { stroke: var(--primary); }
  .field:focus-within svg circle[fill="#8A94A6"],
  .field:focus-within svg path[fill="#8A94A6"] { fill: var(--primary); }
  .field input {
    flex: 1;
    border: none; outline: none; background: transparent;
    font-size: 15px;
    color: var(--text);
    font-family: inherit;
    letter-spacing: .5px;
  }
  .field input::placeholder { color: var(--faint); }
  .field .icon-btn { cursor: pointer; display: flex; }

  .form-options {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-top: 2px;
    font-size: 13px;
  }
  .remember {
    display: flex; align-items: center; gap: 6px;
    color: var(--sub);
    cursor: pointer;
    user-select: none;
  }
  .remember input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
  }

  .login-btn {
    height: 50px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    margin-top: 14px;
    background: linear-gradient(135deg, #0A5FD4 0%, #014DB2 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    letter-spacing: 6px;
    text-indent: 6px;
    box-shadow: 0 10px 22px rgba(1,77,178,.3);
    transition: transform .15s, box-shadow .15s, opacity .2s;
  }
  .login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 28px rgba(1,77,178,.36);
  }
  .login-btn:active { transform: scale(.98); }
  .login-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

  .demo-tip {
    margin-top: 28px;
    padding: 12px 16px;
    border-radius: 10px;
    background: #F0F6FF;
    border: 1px dashed #C7D7EE;
    font-size: 12.5px;
    color: var(--sub);
    line-height: 1.7;
    text-align: center;
    letter-spacing: .3px;
  }
  .demo-tip code {
    background: #fff;
    border: 1px solid #E2EAF8;
    border-radius: 4px;
    padding: 1px 7px;
    margin: 0 2px;
    color: var(--primary);
    font-family: "Cascadia Code", "Consolas", "Microsoft YaHei", monospace;
    font-size: 12px;
    font-weight: 600;
  }

  /* ============ Toast 提示条 ============ */
  .toast {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(10,22,40,.92);
    color: #fff;
    font-size: 13.5px;
    padding: 10px 22px;
    border-radius: 100px;
    opacity: 0;
    pointer-events: none;
    transition: all .3s;
    z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ============ 响应式：<960px 隐藏左侧 ============ */
  @media (max-width: 960px) {
    .login-left { display: none; }
    .login-right { flex: 1; }
  }
</style>
</head>
<body>

<div class="login-page">

  <!-- ============ 左侧：品牌区 ============ -->
  <div class="login-left">
    <div class="brand-top">
      <div class="brand-logo">
        <svg width="42" height="42" viewBox="0 0 44 44" fill="none">
          <path d="M8.5 27L11.2 20.9C11.9 19.3 13.4 18.3 15.1 18.3H28.9C30.6 18.3 32.1 19.3 32.8 20.9L35.5 27" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14.5 13.7C15.1 12.2 16.5 11.2 18.1 11.2H25.9C27.5 11.2 28.9 12.2 29.5 13.7L31.2 18H12.8L14.5 13.7Z" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/>
          <rect x="10.5" y="27" width="23" height="4" rx="2" fill="#FFFFFF"/>
          <circle cx="15.5" cy="28.5" r="2.4" fill="#014DB2"/>
          <circle cx="28.5" cy="28.5" r="2.4" fill="#014DB2"/>
        </svg>
      </div>

      <div class="brand-text">
        <h1>宁公车管理平台</h1>
        <div class="subtitle">WEB ADMIN CONSOLE</div>
      </div>

      <ul class="features">
        <li><span class="dot"></span>统一调度 · 全局可视</li>
        <li><span class="dot"></span>数据驱动 · 高效运营</li>
        <li><span class="dot"></span>权限分明 · 安全可控</li>
      </ul>
    </div>

    <div class="copy">© 2026 宁公车管理平台 · All Rights Reserved</div>
  </div>

  <!-- ============ 右侧：登录表单 ============ -->
  <div class="login-right">
    <div class="login-card">

      <div class="card-head">
        <div class="card-logo">
          <svg width="30" height="30" viewBox="0 0 44 44" fill="none">
            <path d="M8.5 27L11.2 20.9C11.9 19.3 13.4 18.3 15.1 18.3H28.9C30.6 18.3 32.1 19.3 32.8 20.9L35.5 27" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14.5 13.7C15.1 12.2 16.5 11.2 18.1 11.2H25.9C27.5 11.2 28.9 12.2 29.5 13.7L31.2 18H12.8L14.5 13.7Z" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/>
            <rect x="10.5" y="27" width="23" height="4" rx="2" fill="#FFFFFF"/>
            <circle cx="15.5" cy="28.5" r="2.4" fill="#014DB2"/>
            <circle cx="28.5" cy="28.5" r="2.4" fill="#014DB2"/>
          </svg>
        </div>
        <h2>欢迎登录</h2>
        <p class="card-sub">请使用您的账号登录管理后台</p>
      </div>

      <form class="form" id="login-form" onsubmit="return handleLogin(event)">

        <div class="form-field">
          <label class="form-label" for="account">账号</label>
          <div class="field">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8.5" r="3.8" stroke="#8A94A6" stroke-width="1.6"/>
              <path d="M4.5 20.5C4.5 16.6 7.8 13.5 12 13.5S19.5 16.6 19.5 20.5" stroke="#8A94A6" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input type="text" id="account" placeholder="请输入账号" autocomplete="off" maxlength="32">
          </div>
        </div>

        <div class="form-field">
          <label class="form-label" for="pwd">密码</label>
          <div class="field">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="10.5" width="14" height="10" rx="2.5" stroke="#8A94A6" stroke-width="1.6"/>
              <rect x="10.5" y="5.4" width="3" height="5.6" rx="1.5" stroke="#8A94A6" stroke-width="1.6"/>
              <circle cx="12" cy="15.5" r="1.5" fill="#8A94A6"/>
            </svg>
            <input type="password" id="pwd" placeholder="请输入密码" autocomplete="off" maxlength="32">
            <span class="icon-btn" onclick="togglePwd()" title="显示/隐藏密码">
              <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="#8A94A6" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="#8A94A6" stroke-width="1.6"/>
              </svg>
            </span>
          </div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="remember"> <span>记住我</span>
          </label>
        </div>

        <button type="submit" class="login-btn" id="login-btn">登 录</button>
      </form>

      <div class="demo-tip">
        演示账号 <code>admin</code> · 密码 <code>123456</code>
      </div>

    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  /* 密码显隐切换 */
  function togglePwd() {
    var pwd = document.getElementById('pwd');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  }

  /* Toast */
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  /* 登录后回跳：优先 ?redirect=（仅允许同目录 html 文件名，防开放重定向） */
  function nextPage() {
    try {
      var m = /[?&]redirect=([^&]*)/.exec(location.search);
      if (m) {
        var p = decodeURIComponent(m[1]);
        if (/^[A-Za-z0-9_-]+\.html(\?[A-Za-z0-9_=&%.-]*)?$/.test(p)) return p;
      }
    } catch (err) {}
    return 'index.html';
  }

  /* 登录提交 */
  function handleLogin(e) {
    e.preventDefault();
    var btn = document.getElementById('login-btn');
    var account = document.getElementById('account').value.trim();
    var pwd = document.getElementById('pwd').value.trim();

    if (!account || !pwd) { toast('请输入账号和密码'); return false; }

    btn.disabled = true;
    btn.textContent = '登录中...';

    setTimeout(function () {
      // 演示账号：admin / 123456
      if (account === 'admin' && pwd === '123456') {
        try {
          localStorage.setItem('zp_admin_logged', '1');
          sessionStorage.setItem('zp_admin_logged', '1');
          localStorage.setItem('zp_admin_account', document.getElementById('account').value.trim());
          if (document.getElementById('remember').checked) {
            localStorage.setItem('zp_admin_remember', '1');
          } else {
            localStorage.removeItem('zp_admin_remember');
          }
        } catch (err) {}
        location.replace(nextPage());
      } else {
        btn.disabled = false;
        btn.textContent = '登 录';
        toast('账号或密码错误');
      }
    }, 600);

    return false;
  }

  /* 自动回填已保存的账号（仅当用户上次勾选了「记住我」） */
  (function () {
    try {
      if (localStorage.getItem('zp_admin_remember') === '1') {
        var saved = localStorage.getItem('zp_admin_account') || '';
        if (saved) {
          document.getElementById('account').value = saved;
          document.getElementById('remember').checked = true;
        }
      }
    } catch (err) {}
  })();

  /* 密码框回车直接提交 */
  document.getElementById('pwd').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      document.getElementById('login-form').dispatchEvent(new Event('submit', {cancelable: true}));
    }
  });
</script>

</body>
</html>
